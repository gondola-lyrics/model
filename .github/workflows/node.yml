name: Release Node

on:
  push:
    tags:
      - 'node/v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: node

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: '1.72.0'

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#node/v}"
          declared="$(node -p 'require("./node/package.json").version')"
          if [ "$declared" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $declared" >&2
            exit 1
          fi
          if [ "$version" = '0.0.0' ]; then
            echo '0.0.0 is the placeholder, not a release version' >&2
            exit 1
          fi

      - name: Prepare release
        id: release
        run: |
          version="${GITHUB_REF_NAME#node/v}"
          python3 script/generate-change-log.py node "$version" --extract > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate
        run: |
          cp ../LICENSE LICENSE
          python3 ../script/generate-proto-binding.py node --check
        working-directory: node

      - name: Check code
        run: npm run check
        working-directory: node

      - name: Test code
        run: npm run test
        working-directory: node

      - name: Build
        run: npm run build
        working-directory: node

      - name: Publish to npm
        run: npm publish
        working-directory: node
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Node ${{ steps.release.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
