syntax = "proto3";

package lyric.runtime;

option java_multiple_files = true;
option java_outer_classname = "LanguageProto";
option java_package = "gondola.lyric.model.runtime";

// How many normal lines declare one language.
message LanguageUsage {
  // BCP 47 language tag, unique within the list when compared case-insensitively.
  // Explicit `und` tags count like any other tag; missing or empty tags contribute nothing.
  string tag = 1;

  // Number of normal lines declaring this tag on the line or any normal word, with each line contributing at most once.
  // Counts measure line coverage rather than text length, so a multilingual line contributes to several languages.
  uint32 count = 2;
}
