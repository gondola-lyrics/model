syntax = "proto3";

package lyric.runtime;

import "common/line.proto";
import "common/part.proto";
import "common/time.proto";
import "common/word.proto";

// Background vocal line attached to a normal line.
// It belongs to the same part as its parent line.
// It is not wire compatible with storage.LineBackground despite the matching field names.
message LineBackground {
  // Identifier of this background line; empty means none.
  string id = 1;

  // Time range of this background line.
  // The parent line's end covers it, while its start may precede the parent's.
  lyric.common.TimeRange time = 2;

  // Identifiers of the performing agents, the lead first.
  // Multiple ids mean known agents performing together; a named ensemble should be a single GROUP agent instead.
  repeated string agents = 3;

  // BCP 47 language tags of this line, in the order they first appear among its words.
  // Consumers may fall back to the languages of its words when this is empty.
  repeated string languages = 4;

  // Words composing the line in order.
  repeated lyric.common.Word words = 5;

  // Annotations explicitly applied to the whole line.
  lyric.common.LineAnnotation annotation = 6;
}

// A line of the lyric.
// A kind a consumer does not recognize should be read for its words and time, or skipped.
// It is not wire compatible with storage.Line despite the matching field names.
message Line {
  // Identifier of the line; empty means none.
  string id = 1;

  // Kind of this line.
  lyric.common.LineType type = 2;

  // Time range of the line.
  lyric.common.TimeRange time = 3;

  // Structural section this line belongs to; unset means no part information.
  lyric.common.Part part = 4;

  // Identifiers of the performing agents, the lead first.
  // Multiple ids mean known agents performing together; a named ensemble should be a single GROUP agent instead.
  repeated string agents = 5;

  // BCP 47 language tags of this line, in the order they first appear among its words.
  // Consumers may fall back to the languages of its words when this is empty.
  repeated string languages = 6;

  // Words composing the line in order.
  repeated lyric.common.Word words = 7;

  // Annotations explicitly applied to the whole line.
  lyric.common.LineAnnotation annotation = 8;

  // Background lines attached to this line, ordered by TimeRange.start ascending.
  repeated LineBackground backgrounds = 9;
}
