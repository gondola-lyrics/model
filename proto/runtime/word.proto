syntax = "proto3";

package lyric.runtime;

import "common/time.proto";
import "common/word.proto";

option java_multiple_files = true;
option java_outer_classname = "WordProto";
option java_package = "gondola.lyric.model.runtime";

// Whether a word is emphasized, and whether that was stated by the source or derived from the data.
// Emphasis asks for a swell when the word is sung, such as a syllable held longer than usual; it is not linguistic stress.
// An all-default one is omitted, so a word the source stated as unemphasized reads as carrying no emphasis information.
message WordEmphasis {
  // Whether the word is emphasized.
  bool value = 1;

  // Whether this was derived rather than stated by the source.
  bool derived = 2;
}

// A sung word, or the separator between two words.
message Word {
  // Kind of this word.
  lyric.common.WordType type = 1;

  // Time range of the word; unset when it is not sung.
  lyric.common.TimeRange time = 2;

  // Language of this word, as a BCP 47 tag; unset means undetermined.
  optional string language = 3;

  // Text of the word, exactly as the source wrote it.
  string text = 4;

  // Annotations attached to this word.
  lyric.common.WordAnnotation annotation = 5;

  // Emphasis of the word; unset means no emphasis information.
  WordEmphasis emphasis = 6;
}
