syntax = "proto3";

package lyric.common;

option java_multiple_files = true;
option java_outer_classname = "TimingProto";
option java_package = "gondola.lyric.model.common";

// Declared timing precision for a lyric.
enum Timing {
  // The field was not set; treat it as missing rather than as a resolved precision.
  TIMING_UNSPECIFIED = 0;

  // Untimed; line and word TimeRange fields must be unset, so every line carries its content as plain text.
  TIMING_NONE = 1;

  // Timed at line level; each normal or background line should carry a valid TimeRange and its content as plain text.
  TIMING_LINE = 2;

  // Timed per word, where syllable-level sources also land.
  // Lines carry their content as words, each sung one holding a valid TimeRange.
  TIMING_WORD = 3;
}
