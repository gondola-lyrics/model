syntax = "proto3";

package lyric.common;

option java_multiple_files = true;
option java_outer_classname = "UnknownProto";
option java_package = "gondola.lyrics.model.common";

// Unrecognized source metadata retains entry order and allows repeated keys.
message UnknownEntry {
  // The key preserves its original source spelling.
  string key = 1;

  // The value preserves its original source text.
  string value = 2;
}
