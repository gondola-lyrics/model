syntax = "proto3";

package lyric.common;

option java_multiple_files = true;
option java_outer_classname = "LineProto";
option java_package = "gondola.lyrics.model.common";

// Kind of a lyric line.
enum LineType {
  // The field was not set; treat it as missing rather than as a resolved kind, as is every value this enum does not declare.
  LINE_TYPE_UNSPECIFIED = 0;

  // A sung line, carrying its content as either words or plain text.
  LINE_TYPE_NORMAL = 1;

  // A stretch with no singing, carrying no content, only its time range and optionally an id and a part.
  // Its end must be known, and an untimed lyric carries no such line.
  // `part` tells whether the source stated it or it was derived from a gap in the timeline.
  LINE_TYPE_INSTRUMENTAL = 2;
}

// Romanized transliteration of a whole line.
message LineAnnotationRoman {
  // Language of this item, as a BCP 47 tag.
  optional string language = 1;

  // Romanized text.
  string text = 2;

  // Transliteration scheme, compared case-insensitively; unset or empty means unspecified.
  optional string scheme = 3;
}

// Translation of a whole line into another language.
message LineAnnotationTranslation {
  // Target language of this translation, as a BCP 47 tag.
  optional string language = 1;

  // Translated text.
  string text = 2;
}

// Line-level annotations explicitly present in the source.
// Aggregations of word annotations are never stored here.
// Romans hold one entry per language and scheme pair; translations hold one per language.
// Unset and empty language or scheme values identify the same entry.
message LineAnnotation {
  // Romanized transliteration.
  repeated LineAnnotationRoman romans = 1;

  // Translation into another language.
  repeated LineAnnotationTranslation translations = 2;
}
