syntax = "proto3";

package lyric.common;

// A half-open time range in milliseconds: a time t falls inside when start <= t < end.
// Both bounds are always known, so a range is never open above; an unset Time means no timing at all.
// Times exclude Meta.offset, which consumers apply themselves.
// Values above 2^31-1 are invalid.
message Time {
  // Start time in milliseconds.
  uint32 start = 1;

  // End time in milliseconds.
  // An end below start is invalid, and one equal to start is a range no time falls inside.
  uint32 end = 2;
}
