syntax = "proto3";

package lyric.common;

option java_multiple_files = true;
option java_outer_classname = "PartProto";
option java_package = "gondola.lyrics.model.common";

// Structural type of a part.
enum PartType {
  // The field was not set; treat it as missing rather than as a resolved type, as is every value this enum does not declare.
  PART_TYPE_UNSPECIFIED = 0;

  // A type this enum does not cover; the source's own word is kept in `Part.raw`.
  PART_TYPE_OTHER = 1;

  // Introductory section.
  PART_TYPE_INTRO = 2;

  // Verse.
  PART_TYPE_VERSE = 3;

  // Section leading into the chorus.
  PART_TYPE_PRE_CHORUS = 4;

  // Chorus.
  PART_TYPE_CHORUS = 5;

  // Section following the chorus.
  PART_TYPE_POST_CHORUS = 6;

  // Bridge.
  PART_TYPE_BRIDGE = 7;

  // Refrain.
  PART_TYPE_REFRAIN = 8;

  // Instrumental section, carried by the INSTRUMENTAL lines that cover it.
  PART_TYPE_INSTRUMENTAL = 9;

  // Closing section.
  PART_TYPE_OUTRO = 10;
}

// The structural section a line belongs to.
// A non-empty id identifies one contiguous section within the lyric, whose lines share the same type and raw.
// Without an id, adjacent lines with no id and the same type and raw form one section.
message Part {
  // Structural type of the section.
  PartType type = 1;

  // Identifier of the section, compared exactly; unset or empty means none.
  optional string id = 2;

  // The source's own word for this type; unset means the type was inferred rather than stated.
  optional string raw = 3;
}
