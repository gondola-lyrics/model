syntax = "proto3";

package lyric.common;

option java_multiple_files = true;
option java_outer_classname = "PartProto";
option java_package = "gondola.lyrics.model.common";

// Song sections are classified by their structural role.
enum PartType {
  // The section type is unresolved; unrecognized values have the same meaning.
  PART_TYPE_UNSPECIFIED = 0;

  // A source-defined section type outside this enum is recorded in `Part.raw`.
  PART_TYPE_OTHER = 1;

  // An opening section introduces the song.
  PART_TYPE_INTRO = 2;

  // A verse presents a stanza of the song.
  PART_TYPE_VERSE = 3;

  // This section leads into the chorus.
  PART_TYPE_PRE_CHORUS = 4;

  // A chorus is a recurring main section of the song.
  PART_TYPE_CHORUS = 5;

  // This section follows the chorus.
  PART_TYPE_POST_CHORUS = 6;

  // A refrain is a recurring line or passage within the song.
  PART_TYPE_REFRAIN = 7;

  // A bridge contrasts with the surrounding verse or chorus sections.
  PART_TYPE_BRIDGE = 8;

  // An unsung interval appears before or between sung sections; a later sung line is required.
  // Only INSTRUMENTAL lines may carry this type.
  PART_TYPE_INTERLUDE = 9;

  // An instrumental section is represented by the INSTRUMENTAL lines covering it.
  PART_TYPE_INSTRUMENTAL = 10;

  // A closing section ends the song.
  PART_TYPE_OUTRO = 11;
}

// A part describes the structural section containing a line.
message Part {
  // The resolved value classifies the section's structural role.
  PartType type = 1;

  // A non-empty id is compared exactly and identifies a contiguous section whose lines share type and raw.
  // Unset or empty means no id; adjacent lines without ids and with matching type and raw form one section.
  optional string id = 2;

  // The source's type spelling is required for OTHER; unset means the type was inferred.
  optional string raw = 3;
}
