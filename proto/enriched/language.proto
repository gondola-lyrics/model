syntax = "proto3";

package lyric.enriched;

option java_multiple_files = true;
option java_outer_classname = "LanguageProto";
option java_package = "gondola.lyrics.model.enriched";

// Languages are counted independently, so line counts may sum to more than the number of normal lines.
message LanguageUsage {
  // The BCP 47 tag is non-empty and unique within the list under case-insensitive comparison.
  string tag = 1;

  // A normal line contributes once when this tag appears on the line or any normal word.
  // Explicit `und` is counted; absent or empty source tags contribute nothing.
  uint32 line_count = 2;
}
